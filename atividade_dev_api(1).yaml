          type: string
          format: email
          maxLength: 150
        senha:
          type: string
          minLength: 6
          maxLength: 100
        perfil:
          type: string
          minLength: 1
          maxLength: 50
          example: OPERADOR

    UsuarioUpdateRequest:
      type: object
      required: [nome, email, perfil]
      properties:
        nome:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 150
        senha:
          type: string
          minLength: 6
          maxLength: 100
        perfil:
          type: string
          minLength: 1
          maxLength: 50

    UsuarioResponse:
      type: object
