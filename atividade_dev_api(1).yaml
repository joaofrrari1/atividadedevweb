          type: number
          format: double
        saldoAtual:
          type: number
          format: double
        motivo:
          type: string
        usuarioId:
          type: integer
          format: int64
        dataHora:
          type: string
          format: date-time

    EstoqueResponse:
      type: object
      required: [itemId, codigo, nome, quantidadeAtual, estoqueMinimo, situacao]
      properties:
        itemId:
          type: integer
          format: int64
        codigo:
          type: string
        nome:
          type: string
        quantidadeAtual:
          type: number
          format: double
        estoqueMinimo:
          type: number
          format: double
        situacao:
          type: string
          enum: [NORMAL, ESTOQUE_MINIMO, ESTOQUE_BAIXO]

    AlertaEstoqueResponse:
      type: object
      required: [itemId, codigo, nome, quantidadeAtual, estoqueMinimo]
